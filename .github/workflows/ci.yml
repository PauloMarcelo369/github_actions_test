name: CI

on:
  pull_request:
    branches: ["develop"]

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
      - name: análise de lint
        run: npm run lint

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
      - name: roda os testes
        run: npm run test

  # AQUI EU ME PREOCUPO COM CACHE DAS CAMADAS DO DOCKER, E BOM PRA DESEMPENHO :)
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, tests]

    steps:
      - uses: actions/checkout@v4

      - name: Setando docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Cacheando Camadas Docker
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Buildando imagem docker sem fazer o push pro dockerhub
        run: |
          docker buildx build \
            --file Dockerfile \
            --progress=plain \
            --cache-from=type=local,src=/tmp/.buildx-cache \
            --cache-to=type=local,dest=/tmp/.buildx-cache-new \
            --tag ${{ secrets.DOCKER_USERNAME }}/teste:${{ github.sha }} \
            --load .

      - name: atualizando minha nova cache
        run: rm -rf /tmp/.buildx-cache && mv /tmp/.buildx-cache-new /tmp/.buildx-cache
