name: CD

on:
  push:
    branches: ["app_config"]

defaults:
  run:
    shell: bash

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Cache das camadas docker
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Builda e faz o push pro dockerhub :)
        run: |
          docker buildx build \
          --file Dockerfile \
          --progress=plain \
          --cache-from=type=local,src=/tmp/.buildx-cache \
          --cache-to=type=local,dest=/tmp/.buildx-cache-new \
          --tag ${{ secrets.DOCKER_USERNAME }}/teste:${{ github.sha }} \
          --push .

      - name: Fazendo update da cache
        run: rm -rf /tmp/.buildx-cache && mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Fazendo deploy pra vm via ssh
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{secrets.VM_HOST}}
          username: ${{secrets.VM_USER}}
          key: ${{ secrets.VM_SSH_KEY}}
          port: ${{secrets.VM_PORT}}
          script: |

            set -e
            export APP_SHA=${{ github.sha }}
            export DOCKER_USER=${{ secrets.DOCKER_USERNAME }}
            docker login -u $DOCKER_USER -p ${{ secrets.DOCKER_PASSWORD }}
            docker pull $DOCKER_USER/teste:${APP_SHA}

            cd ~/staging

            docker-compose run --rm migrate
            docker stop workflow-api || true
            docker rm workflow-api || true
            docker-compose up -d api
